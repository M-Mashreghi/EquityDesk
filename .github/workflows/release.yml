# Release on a version tag (vX.Y.Z matching pyproject version). The image is published and the
# GitHub release created only after the full CI quality gates pass.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish image and release
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    # Write access is granted to this job only, and only for what it publishes.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tag must match the package version
        run: |
          version="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push versioned image
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          docker build \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="${GITHUB_REF_NAME}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t "${image}:${GITHUB_REF_NAME}" -t "${image}:latest" .
          docker push "${image}:${GITHUB_REF_NAME}"
          docker push "${image}:latest"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "EquityDesk ${GITHUB_REF_NAME}" --generate-notes --verify-tag
