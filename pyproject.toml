[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equitydesk"
version = "0.1.0"
description = "Autonomous, evidence-backed, point-in-time equity research."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
llm = [
    "anthropic>=1.13,<2",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
dashboard = [
    "streamlit>=1.40,<2",
]
dev = [
    "pytest>=8",
    "fastapi>=0.115,<1",
    "streamlit>=1.40,<2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
equitydesk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests touching SQLite/filesystem or several layers",
    "e2e: end-to-end research-run tests with faked external services",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["equitydesk", "factories"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ", "E501"]
# Concept/tag mapping table is kept one concept per line for readability.
"src/equitydesk/analytics/accounting.py" = ["E501"]
"src/equitydesk/analytics/kpis.py" = ["E501"]
"src/equitydesk/analytics/diagnostics.py" = ["E501"]
"src/equitydesk/analytics/peers.py" = ["E501"]
"src/equitydesk/analytics/valuation.py" = ["E501"]
"src/equitydesk/analytics/multiples.py" = ["E501"]
"src/equitydesk/analytics/scenarios.py" = ["E501"]
"src/equitydesk/application/llm.py" = ["E501"]
"src/equitydesk/application/research/*.py" = ["E501"]
"src/equitydesk/application/history.py" = ["E501"]
"src/equitydesk/application/watchlist.py" = ["E501"]
"src/equitydesk/application/workflow.py" = ["E501"]
"src/equitydesk/reporting/*.py" = ["E501"]
"src/equitydesk/api/*.py" = ["E501"]
"src/equitydesk/dashboard/*.py" = ["E501"]
"src/equitydesk/bootstrap.py" = ["E501"]
"src/equitydesk/application/telemetry.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["equitydesk"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
